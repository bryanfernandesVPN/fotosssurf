[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variáveis pedidas no botão "Deploy to Netlify"
[template.environment]
  DATABASE_URL = "Cole a connection string do Neon (postgresql://...)"
  NEXTAUTH_SECRET = "Gere um texto longo aleatório"
  AUTH_SECRET = "Pode ser o mesmo valor do NEXTAUTH_SECRET"
  ADMIN_EMAIL = "fotosssurf@gmail.com"
  ADMIN_PASSWORD = "fotosssurf@"
  ADMIN_NAME = "FOTOSSSURF"
  NEXT_PUBLIC_WHATSAPP_NUMBER = "5521979864010"
